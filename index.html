/* ─────────── SHARED LAYOUT — sidebar + chrome + active-state context ─────────── */

const Theme = {
  light: {
    bg: '#f7f0e1', ink: '#1f1a14', dim: '#5e544a', faint: '#a89e8d',
    rule: '#e0d5bf', wash: '#ece3cd', wash2: '#f1e9d6', accent: '#1d6822',
  },
  dark: {
    bg: '#14110b', ink: '#ebe4d2', dim: '#9c9384', faint: '#5a5346',
    rule: '#2a251c', wash: '#1d1812', wash2: '#1a1610', accent: '#6ba85a',
  },
};

const ActiveCtx = React.createContext({ active: null, set: () => {} });
const useActive = () => React.useContext(ActiveCtx);

function useTheme(initial = 'light') {
  const [t, setT] = React.useState(() => {
    try { return localStorage.getItem('efr-theme') || initial; } catch { return initial; }
  });
  const toggle = () => {
    const next = t === 'light' ? 'dark' : 'light';
    setT(next);
    try { localStorage.setItem('efr-theme', next); } catch {}
  };
  return [t, toggle];
}

/* Highlight style helper for hovered items. */
const hl = (P, isActive) => ({
  background: isActive ? P.wash : 'transparent',
  outline: isActive ? `1px solid ${P.accent}40` : '1px solid transparent',
  outlineOffset: 2,
  transition: 'background 0.12s, outline-color 0.12s',
});

/* ─── SIDEBAR — alphabetical index of EVERYTHING on the page ─── */
function Sidebar({ P, page, entries }) {
  const { active, set } = useActive();
  const C = window.C;

  return (
    <aside style={{
      borderRight: `1px solid ${P.rule}`, padding: '32px 24px 32px 36px',

      {children}

  );
}

/* Footer */
function PageFooter({ P }) {
  return (
    <footer style={{
      marginTop: 60, paddingTop: 16, borderTop: `1px solid ${P.rule}`,
      display: 'flex', justifyContent: 'space-between',

    }}>

      <span>EDITION 2026</span>
    </footer>
  );
}

/* Top-right utility: theme toggle (lives in the reading column, above content). */
function ThemeToggle({ P, theme, onToggle }) {
  return (
    <button onClick={onToggle}
      style={{
        background: 'transparent', border: `1px solid ${P.rule}`,
        fontSize: 11, padding: '4px 12px', cursor: 'pointer', color: P.dim,
        fontFamily: 'var(--ix-mono)', letterSpacing: '0.1em',
      }}>
      {theme === 'light' ? '☾  DARK' : '☀  LIGHT'}
    </button>
  );
}

/* The outer wrapper that every page uses. Renders <Sidebar/> + reading column. */
function PageShell({ page, entries, children }) {
  const [theme, toggleTheme] = useTheme('light');
  const [active, setActive] = React.useState(null);
  const P = Theme[theme];

  // sync background color
  React.useEffect(() => {
    document.body.style.background = P.bg;
    document.body.style.color = P.ink;
  }, [P]);

  return (
    <ActiveCtx.Provider value={{ active, set: setActive }}>
      <div style={{
        background: P.bg, color: P.ink,
        minHeight: '100vh',
        display: 'grid', gridTemplateColumns: '320px 1fr',
        fontFamily: 'var(--ix-sans)',
      }}>
        <Sidebar P={P} page={page} entries={entries}/>
        <main style={{ padding: '32px 56px 80px', maxWidth: 880, width: '100%' }}>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 4 }}>
            <ThemeToggle P={P} theme={theme} onToggle={toggleTheme}/>
          </div>
          {children(P)}
          <PageFooter P={P}/>
        </main>
      </div>
    </ActiveCtx.Provider>
  );
}

window.PageShell = PageShell;
window.Block = Block;

window.hl = hl;

                </ul>
              )}
              <div style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, color: P.faint, letterSpacing: '0.08em' }}>
                {e.tags.join(' · ').toUpperCase()}
              </div>
            </div>
          );
        })}
      </Block>

      {/* RESEARCH RECORD — publications + grants */}
      <Block P={P} num="05" title="Research record">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40 }}>
          {/* Publications */}
          <div>
            <div style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, letterSpacing: '0.18em', color: P.faint, marginBottom: 14 }}>PUBLICATIONS</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '14px 18px', marginBottom: 18 }}>
              {[
                ['First-author', C.publications.firstAuthor],
                ['Co-authored',  C.publications.coAuthored],
                ['h-index',      C.publications.hIndex],
                ['Citations',    '~' + C.publications.citations],
              ].map(([label, value]) => (
                <div key={label}>
                  <div style={{ fontFamily: 'var(--ix-serif)', fontSize: 28, lineHeight: 1, color: P.accent, fontWeight: 500 }}>{value}</div>
                  <div style={{ fontSize: 11, color: P.faint, fontFamily: 'var(--ix-mono)', letterSpacing: '0.06em', marginTop: 3 }}>{label}</div>
                </div>
              ))}
            </div>
            <div style={{ fontSize: 13, lineHeight: 1.65, color: P.dim }}>
              <span style={{ color: P.faint }}>Selected venues: </span>
              <span style={{ fontStyle: 'italic' }}>{C.publications.venues.join(', ')}.</span>
            </div>
            <a href={`https://${C.scholar}`} target="_blank" rel="noopener"
              style={{ marginTop: 14, display: 'inline-block', fontFamily: 'var(--ix-mono)', fontSize: 11, color: P.accent, textDecoration: 'underline', textUnderlineOffset: 3, letterSpacing: '0.04em' }}>
              Full list on Google Scholar →
            </a>
          </div>

          {/* Grants */}
          <div>
            <div style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, letterSpacing: '0.18em', color: P.faint, marginBottom: 14 }}>GRANTS — SOLE PI</div>
            {C.grants.map((g, i) => {
              const id = `grant-${i}`;
              const isActive = active === id;
              return (
                <div key={i} id={id}
                  onMouseEnter={() => set(id)}
                  onMouseLeave={() => set(null)}
                  style={{
                    padding: '10px 12px', margin: '0 -12px',
                    borderTop: i > 0 ? `1px solid ${P.rule}` : 'none',
                    ...hl(P, isActive),
                  }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
                    <span style={{ fontFamily: 'var(--ix-serif)', fontSize: 16, color: P.ink, fontWeight: 500 }}>{g.name}</span>
                    <span style={{ fontFamily: 'var(--ix-mono)', fontSize: 11, color: P.faint, letterSpacing: '0.04em' }}>{g.years}</span>
                  </div>
                  <div style={{ fontSize: 12, color: P.dim, marginTop: 2 }}>{g.funder} · <span style={{ fontFamily: 'var(--ix-mono)', fontSize: 11, color: P.faint }}>{g.number}</span></div>
                  <div style={{ fontSize: 13, color: P.faint, fontStyle: 'italic', marginTop: 4, lineHeight: 1.45 }}>{g.title}</div>
                </div>
              );
            })}
          </div>
        </div>
      </Block>

      {/* GIS & GEOSPATIAL */}
      <Block P={P} num="06" title="GIS & Geospatial">
        <p style={{ fontSize: 14, lineHeight: 1.65, color: P.dim, marginBottom: 14, maxWidth: '64ch' }}>
          From years of fieldwork and research — mapping, terrain modelling, paleoshoreline reconstruction, satellite-imagery work.
        </p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px 10px' }}>
          {(C.gis || []).map(g => {
            const id = `gis-${g.name}`;
            const isActive = g.level === 'primary' && active === id;
            return (
              <span key={g.name}
                id={g.level === 'primary' ? id : undefined}
                onMouseEnter={g.level === 'primary' ? () => set(id) : undefined}
                onMouseLeave={g.level === 'primary' ? () => set(null) : undefined}
                style={{
                  fontSize: 14, fontFamily: 'var(--ix-serif)',
                  color: g.level === 'primary' ? P.ink : g.level === 'proficient' ? P.dim : P.faint,
                  fontWeight: g.level === 'primary' ? 500 : 400,
                  textDecoration: g.level === 'familiar' ? 'underline' : 'none',
                  textUnderlineOffset: 3,
                  textDecorationColor: P.faint,
                  padding: '2px 4px',
                  ...(g.level === 'primary' ? hl(P, isActive) : {}),
                }}>
                {g.name}
              </span>
            );
          })}
        </div>
      </Block>

      {/* EDUCATION */}
      <Block P={P} num="07" title="Education">
        {C.education.map((e, i) => {
          const id = `edu-${i}`;
          const isActive = active === id;
          return (
            <div key={i} id={id}
              onMouseEnter={() => set(id)}
              onMouseLeave={() => set(null)}
              style={{
                padding: '12px', margin: '0 -12px',
                borderTop: i > 0 ? `1px solid ${P.rule}` : 'none',
                ...hl(P, isActive),
              }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', gap: 14, flexWrap: 'wrap' }}>
                <span style={{ fontFamily: 'var(--ix-serif)', fontSize: 17, color: P.ink, fontWeight: 500 }}>{e.degree}</span>
                <span style={{ fontFamily: 'var(--ix-mono)', fontSize: 11, color: P.faint }}>{e.year}</span>
              </div>
              <div style={{ fontSize: 13, color: P.dim, marginTop: 2 }}>{e.inst}</div>
              <div style={{ fontSize: 13, color: P.faint, fontStyle: 'italic', marginTop: 4 }}>{e.thesis}</div>
            </div>
          );
        })}
      </Block>

      {/* LANGUAGES + CERTIFICATIONS */}
      <Block P={P} num="08" title="Languages & Certifications">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40 }}>
          <div>
            <div style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, letterSpacing: '0.18em', color: P.faint, marginBottom: 8 }}>SPOKEN</div>
            {C.languages.map(l => (
              <div key={l.name} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: `1px solid ${P.rule}` }}>
                <span style={{ fontFamily: 'var(--ix-serif)', fontSize: 16 }}>{l.name}</span>
                <span style={{ fontFamily: 'var(--ix-mono)', fontSize: 11, color: P.dim }}>{l.level}</span>
              </div>
            ))}
          </div>
          <div>
            <div style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, letterSpacing: '0.18em', color: P.faint, marginBottom: 8 }}>CERTIFICATIONS</div>
            {C.certs.map((c, i) => {
              const id = `cert-${i}`;
              const isActive = active === id;
              return (
                <div key={c.name} id={id}
                  onMouseEnter={() => set(id)}
                  onMouseLeave={() => set(null)}
                  style={{ padding: '8px 6px', margin: '0 -6px', borderBottom: `1px solid ${P.rule}`, ...hl(P, isActive) }}>
                  <div style={{ fontFamily: 'var(--ix-serif)', fontSize: 14 }}>{c.name}</div>
                  <div style={{ fontSize: 11, color: P.faint, fontFamily: 'var(--ix-mono)' }}>{c.issuer} · {c.year}</div>
                </div>
              );
            })}
          </div>
        </div>
      </Block>

      {/* CONTACT */}
      <Block P={P} num="09" title="Get in touch">
        <p style={{ fontFamily: 'var(--ix-serif)', fontSize: 22, lineHeight: 1.45, color: P.ink, margin: '0 0 20px', maxWidth: 600 }}>
          Looking for Gen-AI engineering, AI tooling, or applied-ML roles — Copenhagen / Roskilde or remote.
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '4px 30px', maxWidth: 560 }}>
          {[
            { k: 'Email',    v: C.email,            url: `mailto:${C.email}` },
            { k: 'Location', v: C.location,         url: null },
            { k: 'GitHub',   v: C.github,           url: `https://${C.github}` },
            { k: 'LinkedIn', v: C.linkedin,         url: `https://${C.linkedin}` },
            { k: 'Scholar',  v: 'Google Scholar →', url: `https://${C.scholar}` },
            { k: 'ORCID',    v: C.orcid,            url: `https://orcid.org/${C.orcid}` },
            { k: 'Kaggle',   v: C.kaggle,           url: `https://${C.kaggle}` },
          ].map(({ k, v, url }) => {
            const inner = (
              <>
                <span style={{ fontFamily: 'var(--ix-mono)', fontSize: 10, letterSpacing: '0.16em', color: P.faint, alignSelf: 'center' }}>{k.toUpperCase()}</span>
                <span style={{ fontSize: 13, color: url ? P.accent : P.ink, fontFamily: 'var(--ix-mono)' }}>{v}</span>
              </>
            );
            const baseStyle = {
              display: 'flex', justifyContent: 'space-between', padding: '8px 0',
              borderBottom: `1px solid ${P.rule}`, gap: 10,
              textDecoration: 'none', color: 'inherit',
            };
            return url
              ? <a key={k} href={url} target="_blank" rel="noopener" style={baseStyle}>{inner}</a>
              : <div key={k} style={baseStyle}>{inner}</div>;
          })}
        </div>
      </Block>
    </>
  );
}

window.HomeContent = HomeContent;
window.buildHomeEntries = buildHomeEntries;

</script>

<script type="text/babel" data-presets="react">
  const App = () => {
    const entries = window.buildHomeEntries();
    return (
      <window.PageShell page="home" entries={entries}>
        {(P) => <window.HomeContent P={P} photoSrc={window.EIKE_PHOTO}/>}
      </window.PageShell>
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
